[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blur-gs"
version = "0.2.0"
description = "Geometry-coupled continuous exposure trajectories for motion-blurred Gaussian splatting"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "Pillow>=10", "PyYAML>=6"]

[project.optional-dependencies]
cuda = ["gsplat==1.5.3"]
logging = ["tensorboard>=2.16,<3"]
evaluation = ["lpips==0.1.4"]
dev = ["pytest>=8", "ruff>=0.11", "tensorboard>=2.16,<3"]

[project.scripts]
blur-gs = "blur_gs.cli:main"

[tool.setuptools]
py-modules = ["train", "render", "metrics"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arguments*", "scene*", "gaussian_renderer*", "utils*", "scripts*", "blur_gs*"]
exclude = ["tests*", "data*", "outputs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
