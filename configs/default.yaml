# Starting hyperparameters, not values claimed to reproduce a published benchmark.
backend: gsplat
device: cuda
iterations: 30000
# Render ten virtual poses including both exposure endpoints (two learned endpoint twists).
exposure_samples: 10
sh_degree: 3
sh_interval: 1000
densify_from: 500
densify_until: 15000
# Intervals below count geometry/joint updates, not frozen trajectory steps.
densify_interval: 100
densify_grad_threshold: 0.0002
prune_opacity: 0.005
max_gaussians: 1000000
opacity_reset_interval: 3000
trajectory_steps: 1
geometry_steps: 1
joint_start: 27000
joint_lr_scale: 0.1
scene_lr: 0.001
position_lr: 0.00016
trajectory_lr: 0.001
depth_warmup_steps: 2000
motion_ramp_steps: 1000
motion_weight: 0.1
geometry_motion_weight: 0.05
flow_weight: 1.0
magnitude_weight: 0.1
direction_weight: 0.01
# Image-as-an-IMU measures endpoints, not total length of a nonlinear path.
magnitude: endpoint
# A linear twist has zero second temporal derivative.
acceleration_weight: 0.0
pose_weight: 0.01
dssim_weight: 0.2
alpha_threshold: 0.1
linear_exposure: true
initialize_motion: true
gradient_clip: 10.0
checkpoint_every: 1000
log_every: 50
seed: 42
