# Starting hyperparameters, not values claimed to reproduce a published benchmark.
backend: gsplat
device: cuda
iterations: 30000
# Render ten virtual poses including both exposure endpoints (two learned endpoint twists).
exposure_samples: 10
trajectory_steps: 1
geometry_steps: 1
joint_start: 27000
joint_lr_scale: 0.1
scene_lr: 0.001
position_lr: 0.00016
trajectory_lr: 0.001
depth_warmup_steps: 2000
motion_ramp_steps: 1000
motion_weight: 0.1
geometry_motion_weight: 0.05
flow_weight: 1.0
magnitude_weight: 0.1
direction_weight: 0.01
# Image-as-an-IMU measures endpoints, not total length of a nonlinear path.
magnitude: endpoint
# A linear twist has zero second temporal derivative.
acceleration_weight: 0.0
pose_weight: 0.01
dssim_weight: 0.2
alpha_threshold: 0.1
linear_exposure: true
initialize_motion: true
gradient_clip: 10.0
# Real-scene 3DGS topology refinement. Set densify_every: 0 to disable.
densify_from: 500
densify_until: 15000
densify_every: 250
densify_grad_threshold: 0.0002
prune_opacity_threshold: 0.01
max_gaussians: 500000
densify_jitter: 0.5
checkpoint_every: 1000
log_every: 50
seed: 42
