name: Geometry tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy==1.26.4 Pillow==10.2.0 pytest==8.1.1 pypose==0.7.3 scipy==1.11.4 plyfile==1.0.3 pytorch-msssim==1.0.0
      - run: python -m pytest -q -m 'not cuda'
